name: Calculadora CI with Maven
on:
 push:
   branches: [ "master" ]
 pull_request:
   branches: [ "master" ]
jobs:
 build:
   runs-on: ubuntu-latest
   strategy:
     matrix:
       java: [ '17', '21', '25' ]
   steps:
     - name: Descargar el código del repositorio
       uses: actions/checkout@v7.0.1
   
     - name: Configurar el JDK ${{ matrix.java }}
       uses: actions/setup-java@v6.1.0
       with:
         java-version: ${{ matrix.java }}
         distribution: 'temurin'
         
     - name: Ejecutar los tests y empaquetar
       run: mvn clean verify

     - name: Guardar la calculadora compilada
       uses: actions/upload-artifact@v7.0.2
       with:
         name: kalkulagailua-tdd-java${{ matrix.java }}
         path: target/*.jar
       
