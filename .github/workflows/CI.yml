name: Calculadora CI with Maven
on:
 push:
   branches: [ "master" ]
 pull_request:
   branches: [ "master" ]
jobs:
 build:
   runs-on: ubuntu-latest
   steps:
     - name: Descargar el código del repositorio
       uses: actions/checkout@v7.0.1
   
     - name: Configurar el JDK 25
       uses: actions/setup-java@v6.1.0
       with:
         java-version: '25'
         distribution: 'temurin'
         
     - name: Ejecutar los tests y empaquetar
       run: mvn clean verify

     - name: Guardar la calculadora compilada
       uses: actions/upload-artifact@v7.0.2
       with:
         name: kalkulagailua-tdd
         path: target/*.jar
       
